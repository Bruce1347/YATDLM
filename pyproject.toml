[tool.poetry]
name = "yatdlm"
version = "0.1.0"
description = ""
authors = ["Kaci Adjou <adjou.kaci@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.12"
django = ">=5.0.2"
psycopg2-binary = "^2.8.5"
pydantic = "^2.3"

[tool.poetry.dev-dependencies]
ipython = "^8.3.0"
pylint = ">=2.5.3"
django-debug-toolbar = "^3.4.0"

[tool.poetry.group.dev.dependencies]
factory-boy = "^3.2.1"
black = "^23.1.0"
flake8 = "^6.0.0"
freezegun = "^1.4.0"
coverage = "^7.6.9"
ruff = "^0.9.10"

[flake8]
max-line-length = 90

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.coverage.run]
omit = [
    "*__init__*",
    "pre-commit.py",
    "docker-bootstrap.py",
    "yatdlm/todo/migrations/*",
    "yatdlm/manage.py",
    "yatdlm/yatdlm/wsgi.py",
    "yatdlm/todo/tests/**/*.py",
]
source = ["yatdlm"]
command_line = "yatdlm/manage.py test todo"